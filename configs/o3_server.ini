# DynamoRIO Out-of-Order CPU & Cache Server Configuration
# Extends and overwrites o3_default.ini with large server-grade parameters.

# Inherit baseline parameters from default desktop profile.
include = o3_default.ini

[cpu]
# Server-grade aggressive out-of-order window.
rob_capacity = 512
# Larger load queue for memory-intensive workloads.
lq_capacity = 128
# Larger store queue.
sq_capacity = 96
# 8-wide superscalar pipeline.
fetch_width = 8
decode_width = 8
dispatch_width = 8
commit_width = 8

[l2]
# Larger 1MB private L2 cache per core.
size = 1MB
assoc = 16
# Expanded L2 MSHR capacity for high MLP.
mshr_capacity = 64

[l3]
# Large shared 32MB Last-Level Cache.
size = 32MB
assoc = 16
# Expanded LLC MSHR capacity for parallel memory requests.
mshr_capacity = 128
