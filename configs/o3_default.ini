# DynamoRIO Out-of-Order CPU & Cache Default Configuration
# Base configuration profile representing a modern high-performance desktop processor.

[cpu]
# Number of processor cores simulated.
num_cores = 1
# Pipeline width: fetch width in instructions per cycle.
fetch_width = 4
# Pipeline width: decode width in instructions per cycle.
decode_width = 4
# Pipeline width: dispatch width in instructions per cycle.
dispatch_width = 4
# Pipeline width: commit width in instructions per cycle.
commit_width = 4
# Reorder Buffer (ROB) capacity in dynamic instructions.
rob_capacity = 256
# Load Queue (LQ) capacity in entries.
lq_capacity = 72
# Store Queue (SQ) capacity in entries.
sq_capacity = 56
# Branch Target Buffer (BTB) capacity in entries.
btb_entries = 4096
# Branch misprediction penalty in core clock cycles.
branch_mispredict_penalty = 14
# Execution latency for general integer ALU operations.
alu_latency = 1
# Speculative wrong-path execution modeling toggle (1 = enabled, 0 = disabled).
enable_wrong_path = 1
# Maximum speculative instruction depth on branch mispredictions.
max_speculative_depth = 32

[l1i]
# Private L1 Instruction Cache total capacity.
size = 32KB
# Private L1 Instruction Cache associativity (ways).
assoc = 8
# Private L1 Instruction Cache hit latency in clock cycles.
latency = 4
# Number of Miss Status Holding Registers (MSHRs) for L1I.
mshr_capacity = 16
# Read Queue (RQ) capacity for L1I instruction fetches.
rq_capacity = 32
# Prefetch Queue (PQ) capacity for L1I.
pq_capacity = 32

[l1d]
# Private L1 Data Cache total capacity.
size = 32KB
# Private L1 Data Cache associativity (ways).
assoc = 8
# Private L1 Data Cache hit latency in clock cycles.
latency = 4
# Number of Miss Status Holding Registers (MSHRs) for L1D.
mshr_capacity = 16
# Read Queue (RQ) capacity for demand loads.
rq_capacity = 32
# Write Queue (WQ) capacity for stores and write-coalescing.
wq_capacity = 32
# Prefetch Queue (PQ) capacity for L1D.
pq_capacity = 32

[l2]
# Private unified L2 Cache total capacity.
size = 256KB
# Private unified L2 Cache associativity (ways).
assoc = 8
# Private unified L2 Cache hit latency in clock cycles.
latency = 12
# Number of Miss Status Holding Registers (MSHRs) for L2.
mshr_capacity = 32
# Read Queue (RQ) capacity for L2 requests.
rq_capacity = 48
# Write Queue (WQ) capacity for writebacks from L1D.
wq_capacity = 48
# Prefetch Queue (PQ) capacity for L2.
pq_capacity = 32

[l3]
# Shared unified L3 / Last-Level Cache (LLC) total capacity.
size = 8MB
# Shared unified L3 / Last-Level Cache associativity (ways).
assoc = 16
# Shared unified L3 / Last-Level Cache hit latency in clock cycles.
latency = 35
# Number of Miss Status Holding Registers (MSHRs) for L3.
mshr_capacity = 64
# Read Queue (RQ) capacity for L3 requests.
rq_capacity = 64
# Write Queue (WQ) capacity for writebacks from L2.
wq_capacity = 64
# Prefetch Queue (PQ) capacity for L3.
pq_capacity = 64

[mmu]
# Page Walk Cache (PWC) entries per core.
pwc_entries = 32
# Page Walk Cache associativity (ways).
pwc_assoc = 4
# Base virtual memory page size.
page_size = 4KB

[memory]
# Main memory DRAM access latency in clock cycles.
dram_latency = 150
# Cache line size in bytes across all hierarchy levels.
line_size = 64
