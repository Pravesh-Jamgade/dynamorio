# DynamoRIO Out-of-Order CPU & Cache Server Sector L2 TLB Configuration
# Extends o3_server.ini and configures a Sectored L2 TLB (8 PTEs per sector block).
#
# Geometry:
# - Preserves total 1536 PTE capacity: 32 sets x 6 ways (192 blocks x 8 PTEs = 1536 entries).
# - Combined with server-grade aggressive out-of-order window (512 ROB, 128 LQ, 96 SQ, 32MB LLC).
include = o3_server.ini

[mmu]
# Keep baseline PWC and page size.
pwc_entries = 32
pwc_assoc = 4
page_size = 4KB

[l2_tlb]
# Unified L2 TLB total PTE entries (preserved at 1536 entries).
entries = 1536
# Unified L2 TLB associativity (ways).
assoc = 6
# L2 TLB sector size: 8 (32 sets x 6 ways = 192 sector blocks x 8 PTEs = 1536 entries).
sector_size = 8
