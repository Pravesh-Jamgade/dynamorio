# Multi-level Nested INI Test Configuration
# Tests inclusion of o3_server.ini which itself includes o3_default.ini.

# Inherit from server configuration profile.
include = o3_server.ini

[cpu]
# Overwrite core count for quad-core server simulation.
num_cores = 4

[l1d]
# Overwrite L1D MSHR capacity.
mshr_capacity = 32
