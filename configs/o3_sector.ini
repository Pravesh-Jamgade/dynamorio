# DynamoRIO Out-of-Order CPU & Cache Sector L2 TLB Configuration
# Extends o3_default.ini and configures a Sectored L2 TLB.
#
# In this configuration:
# - Instead of placing a single PTE from the leaf PTE block, we place 2, 4, or 8 PTEs
#   (assuming a 64-byte cache line holds eight 8-byte PTEs).
# - The total number of entries is kept the same (1536 PTEs):
#     * Baseline (sector = 1): 256 sets x 6 ways (1536 entries, 1 PTE per block)
#     * Sector = 2: 128 sets x 6 ways (768 blocks x 2 PTEs = 1536 entries)
#     * Sector = 4: 64 sets x 6 ways (384 blocks x 4 PTEs = 1536 entries)
#     * Sector = 8: 32 sets x 6 ways (192 blocks x 8 PTEs = 1536 entries)
# - Entries brought in for sector=S are those with the same entry_offset / S.

# Inherit baseline CPU pipeline and cache parameters.
include = o3_default.ini

[mmu]
# Keep baseline PWC and page size.
pwc_entries = 32
pwc_assoc = 4
page_size = 4KB

[l2_tlb]
# Unified L2 TLB total PTE entries (preserved at 1536 entries).
entries = 1536
# Unified L2 TLB associativity (ways).
assoc = 6
# L2 TLB sector size: 8 (32 sets x 6 ways = 192 sector blocks x 8 PTEs = 1536 entries).
# To run with sector=2 (128x6) or sector=4 (64x6), change sector_size to 2 or 4.
sector_size = 8
