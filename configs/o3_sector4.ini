# DynamoRIO Out-of-Order CPU & Cache Sector-4 L2 TLB Configuration
# Extends o3_default.ini and configures a Sectored L2 TLB with 4 PTEs per sector block.
#
# Geometry:
# - Preserves total 1536 PTE capacity: 64 sets x 6 ways (384 blocks x 4 PTEs = 1536 entries).
# - Block size = 16 KB (4 pages).

# Inherit baseline CPU pipeline and cache parameters.
include = o3_default.ini

[mmu]
# Keep baseline PWC and page size.
pwc_entries = 32
pwc_assoc = 4
page_size = 4KB

[l2_tlb]
# Unified L2 TLB total PTE entries (preserved at 1536 entries).
entries = 1536
# Unified L2 TLB associativity (ways).
assoc = 6
# L2 TLB sector size: 4 (64 sets x 6 ways = 384 blocks x 4 PTEs = 1536 entries).
sector_size = 4
